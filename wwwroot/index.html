<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>test</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="test.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body style="background-color: #0f172a; margin: 0; padding: 0;">
    <div id="app">
        <!-- Minimalist, professional loader that matches your dark theme -->
        <div
            style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', sans-serif; color: #38bdf8;">
            <div style="font-size: 24px; font-weight: 800; margin-bottom: 10px;">Дмитрий<span>.</span>NET</div>
            <div style="font-size: 14px; color: #94a3b8;">Загрузка приложения...</div>
        </div>
    </div>

    <!-- Error UI styled to look cleaner if a crash happens -->
    <div id="blazor-error-ui"
        style="background: #1e293b; color: #f8fafc; bottom: 0; box-shadow: 0 -4px 10px rgba(0,0,0,0.3); display: none; left: 0; padding: 0.6rem 1.25rem; position: fixed; width: 100%; z-index: 1000; border-top: 1px solid #334155;">
        <span style="color: #ef4444; font-weight: bold;">Ошибка приложения.</span> Пожалуйста, попробуйте обновить
        страницу.
        <a href="." class="reload" style="color: #38bdf8; margin-left: 10px; text-decoration: underline;">Обновить</a>
        <a class="dismiss" style="cursor: pointer; float: right; color: #94a3b8;">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
